services:
  mongo:
    image: mongo:7
    container_name: taccat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - taccat-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taccat-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 3000
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/taccat
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - taccat-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: taccat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - taccat-network

volumes:
  mongo_data:

networks:
  taccat-network:
    driver: bridge
